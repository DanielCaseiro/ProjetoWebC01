    <main>

<!-- ------------------------- Contatos 01 ------------------------- -->

    <section class="contatos">

      <!-- metade esquerda -->

        <div class="contatos-metade-esquerda">

          <div class="container-formulario">

          <div class="col-12 col-lg-5 justify-content-between mb-4 mt-4">
            <form class="bg-black p-4 rounded-4 text-white"
                style="font-family: 'Jura', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
                <div class="mb-3">
                    <label for="name" class="form-label m-0">Nome:</label>
                    <input type="text" class="form-control" id="name">
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label m-0">Email:</label>
                    <input type="email" class="form-control" id="email" aria-describedby="emailHelp">
                </div>
                <div class="mb-5">
                    <label for="formTextArea" class="form-label m-0">Mensagem:</label>
                    <textarea class="form-control" id="formTextArea" rows="5"
                        style="resize: none;"></textarea>
                </div>
                <button type="button" class="btn btn-black text-white rounded-pill border-white w-100"
                    data-bs-toggle="modal" data-bs-target="#staticBackdrop">
                    Enviar
                </button>
            </form>
        </div>

        </div>
            
        </div>

        <!-- Modal da mensagem do formulário -->

        <div class="modal fade" id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
        aria-labelledby="staticBackdropLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-center"
                style="font-family: 'Jura', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
                <div class="modal-body d-flex flex-column align-items-center justify-content-center">
                    <p class="mb-3">Seu formulário foi enviado com sucesso!</p>
                    <button type="button" class="btn btn-primary text-white rounded-pill px-5 mt-2"
                        data-bs-dismiss="modal">Ok</button>
                </div>
            </div>
        </div>
    </div>
        

    <div class="contatos-divisoria"></div>

              <!-- metade direita -->
       
        <div class="contatos-metade-direita">

          <figure class="text-end"
          style="font-family: 'Jura', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
          <blockquote class="blockquote text-white">
              <p style="text-align: center;">"Viajar é descobrir que todos estão errados <br> sobre outros países."</p>
          </blockquote>
          <figcaption class="blockquote-footer text-white">
              Aldous Huxley
          </figcaption>
      </figure>
            
        </div>
        
    </section>

  </main>

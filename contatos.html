<!DOCTYPE html>
<html lang="pt_BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    
    <!-- link fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Jura:wght@300..700&family=Josefin+Slab:ital,wght@0,100..700;1,100..700&family=Jura:wght@300..700&display=swap" rel="stylesheet">


    <!-- link bootstrap css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    
    <!-- link para css file -->
    <link rel="stylesheet" href="style.css">

</head>
<body>

    <!-- navbar do bootstrap -->

    <!-- faltam os links dos botões para as outras páginas! -->

    <nav class="navbar navbar-expand-lg bg-transparent py-3" style="background: none; position: absolute; width: 100%; z-index: 5;"> <!-- usar o style="background: none" foi a única maneira que encontrei de deixar a navbar sobreposta à imagem da Hero section; py-3 ajusta a posição em relação ao topo da pagina; p é de padding, y é de eixo y (vertical) e corresponde a um padding-top + padding-bottom -->
        <div class="container-fluid justify-content-end"> <!-- justify-content-end mantem o conteúdo alinhado à direita -->
          
            <!-- Logo a esquerda -->
    <a href="index.html" class="navbar-brand">
        <img src="Imagens/Icones/Logo.svg" alt="Logo" style="height: 50px;">
      </a>
  
            <!-- Navbar links a direita -->

          <ul class="navbar-nav ms-auto d-flex flex-row gap-4"> <!-- gap-4 define um espaço determinado entre os elementos filhos dentro do flex container (equivalente ao gap no css); ms-auto (margin-start auto) também mantém o conteúdo alinhado à direta ao ocupar todo o espaço disponível a partir da margem esquerda (reduntante?) -->
            <li class="nav-item">
              <a class="nav-link px-3" style="color: white;" href="#">Acomodação</a> <!-- px (semelhante ao py) corresponde a padding no eixo horizontal, e equivale a um padding-left + padding-right -->
            </li>
            <li class="nav-item">
              <a class="nav-link px-3" style="color: white;" href="#">Locais</a>
            </li>
            <li class="nav-item">
              <a class="nav-link px-3" style="color: white;" href="#">Blog</a>
            </li>
            <li class="nav-item">
                <a class="nav-link px-3" style="color: white;" href="#">Contatos</a>
              </li>
          </ul>
        </div>
      </nav>

      <!-- Main Contatos section -->

    <section class="contatos d-flex align-items-center justify-content-center text-white"> <!-- d-flex: define como flex container -->

        <div class="contatos-metade-esquerda">
            <form action=""></form>
        </div>
       
        <div class="contatos-metade-direita">
            <div class="contatos-texto-1">
                <p>"Viajar é descobrir que todos estão</p>
                <p>errados sobre outros países."</p>
                <p>- Aldous Huxley</p>
            </div>
            
        </div>
        
    </section>



 <!-- Rodapé -->
 <footer>

    <div class="footer-texto-1">
      <p>LIVING AROUND</p>
    </div>

      <!-- Icones de Redes Sociais -->

      <div class="social-icons">
        <a href="https://facebook.com/yourprofile" target="_blank" class="social-icon">
          <img src="Imagens/Icones/FacebookIcon.svg" alt="Facebook" />
        </a>
    
        <a href="https://twitter.com/yourprofile" target="_blank" class="social-icon">
          <img src="Imagens/Icones/InstagramIcon.svg" alt="Instagram" />
        </a>
    
        <a href="https://linkedin.com/in/yourprofile" target="_blank" class="social-icon">
          <img src="Imagens/Icones/XIcon.svg" alt="X" />
        </a>
      </div>


    <div class="footer-texto-2">
      <p>Power by Cesae Digital</p>
    </div>

  </footer>
  
<!-- link bootstrap js -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>   
</body>
</html>

<a href="index.html" class="navbar-brand">

<main>

    <!-- ------------------------- Locais 01 ------------------------- -->


    <section class="locais01">

        <div class="locais01-metade-esquerda">

            <div class="locais01-metade-esquerda-formulario">

                <form class="p-4 pt-5 pb-5 rounded-5 text-white"
                                style="font-family: 'Jura', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background-color: #D9D9D9;">

                                <fieldset class="mb-3 text-black">
                                    <label for="country" class="form-label m-0">Escolha o país:</label>
                                    <select class="form-select" id="country" onchange="updateCities()">
                                        <option selected disabled value="">país</option>
                                        <option value="br">Brasil</option>
                                        <option value="pt">Portugal</option>
                                        <option value="us">Estados Unidos</option>
                                    </select>
                                </fieldset>

                                <fieldset class="mb-3 text-black pb-3">
                                    <label for="city" class="form-label m-0">Escolha a cidade:</label>
                                    <select class="form-select" id="city" disabled>
                                        <option selected disabled value="">cidade</option>
                                    </select>
                                </fieldset>

                                <div class="text-center pb-4">
                                    <button type="button" class="btn text-black w-50 border-0 px-4 py-3" style="background-color: #686931;" id="showMapBtn" 
                                        onclick="showMapSection()">
                                        Ver
                                    </button>
                                </div>
                            </form>

            </div>

        </div>

        <div class="locais01-metade-direita">

            <div id="mapSection" style="display: none;">
                <h2>Porto</h2>
                <p>Porto é uma linda cidade em Portugal, conhecida pelo seu vinho, sua arquitetura histórica e o rio Douro.</p>
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3111.3643706023127!2d-8.611003184656938!3d41.149451779287446!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xd2465f122abc5b5%3A0x400ebbde49036c0!2sPorto!5e0!3m2!1sen!2spt!4v1615566759871!5m2!1sen!2spt"
                    width="100%" height="300" style="border:0;" allowfullscreen="" loading="lazy">
                </iframe>
            </div>

        </div>

       
    </section>


</main>
